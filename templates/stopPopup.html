<div id="stopPopupOverlay" class="overlay-container">
  <div class="popup-box">
    <h2>{{ stop_name }}</h2>

    <p>{{ stop_description }}</p>

    <button type="button" class="btn-close-popup" id="closeStopPopup">
      Go Back
    </button>

    <button type="button" class="btn-submit" id="continueStopPopup">
      Continue To Next Stop 
    </button>

  </div>
</div>
