{% extends "adminnav.html" %}
{% block title %} Reviews {% endblock %}
{% block content %}
<script src="/static/deletereview.js"></script>

<div class="d-flex justify-content-end">
  <div class="btn-group dropstart">
    <button class="btn dropdown-toggle dropdownbtn" data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="true">
      Filter
    </button>

    <ul class="dropdown-menu dropdown-menu-start">
      <li><a class="dropdown-item" href="/adminreviews">All</a></li>
      {% for i in tourdropdown %}
        <li><a class="dropdown-item" href="/adminreviews?tour_id={{ i[0] }}">{{ i[1] }}</a></li>
      {% endfor %}
    </ul>
  </div>
</div>

<div class="row">
  <div class="col-12 mb-3 mb-lg-5">
    <div class="overflow-hidden card table-nowrap table-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">User Reviews</h5>
      </div>
      <div class="table-responsive">
        <table class="table mb-0">
          <thead class="small text-uppercase bg-body text-muted">
            <tr>
              <th>Tour Name</th>
              <th>Rating</th>
              <th>Comment</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {% for i in col %}
              <tr class="align-middle">
                <td>
                  <div class="d-flex align-items-center">
                    <div class="h6 mb-0 lh-1">{{ i[3] }}</div>
                  </div>
                </td>
                <td><span class="d-inline-block align-middle">{{ i[1] }}</span></td>
                <td>{{ i[2] }}</td>
                <td><button onclick="deleteReview({{ i[0] }})">Delete</button></td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

{% endblock %}
