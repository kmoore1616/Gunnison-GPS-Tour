{% extends "adminnav.html" %}
{% block title %} Tours {% endblock %}
{% block content %}
<body id="tourEditor">
    <script src="/static/tourEditor.js"></script>
    <h1 id="editTourName">{{ tour.name }}</h1>
    <h3>Tour Rating: {{ tour.average_rating }} Stars</h3>
    <h3>Estimated Length: {{ tour.estimated_completion_time }} Minutes</h3>
    <form action="/saveTour/{{tour.id}}" method="POST">
        <fieldset>

            <label>Tour Name:</label>
            <input type="text" name="name" value="{{tour.name}}" required>

            <input type="checkbox" id="is_public" name="is_public">
            <label for="is_public">Public</label><br><br>

            <label>Tour Description:</label><br>
            <textarea id="tour-description" name="description" maxlength="1000" rows="10" cols="50">{{tour.description}}</textarea>

            <table id="edit-tour-places">
                <tr id="edit-tour-headers">
                    <th colspan="4">Tour Stops</th>
                </tr>
                <tr id="add-stop-button">
                    <td colspan="4">Add Stop</td>
                </tr>
                
            </table>

            <input type="submit" value="SAVE"><br>
        </fieldset>
    </form>
    <button id="delete-tour-button" type="button" onclick="deleteTour()">DELETE TOUR</button>
</body>
{% endblock %}
