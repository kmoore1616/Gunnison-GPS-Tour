{% extends "visitornav.html" %}
{% block head %}
<title>View Tour</title>
<style>
    gmp-map {
        height: clamp(300px, 60vh, 700px);
        width: 100%;
        display: block;
    }

    @media (max-width: 600px) {
        gmp-map {
            height: 50vh;
        }
    }
</style>

<!-- prettier-ignore -->
<script>(g => {
    var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document,
        b = window;
    b = b[c] || (b[c] = {});

        u = () => h || (h = new Promise(async (f, n) => {
            await (a = m.createElement("script"));
            e.set("libraries", [...r] + "");
            for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]);
            e.set("callback", c + ".maps." + q);
            a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
            d[q] = f;

({key: "AIzaSyA5NCmT4YZvoa5KVQcOF1XHN3B8PxNpapQ", v: "weekly"});</script>

{% endblock %}
{% block content %}

<body id="view">
<div id="tour-id" hidden>{{ tour_id }}</div>
<h3 id="next-stop-name"></h3>
<!-- THIS NEEDS TO CENTER ON START! -->
<div style="position: relative; width: 100%;">
    <gmp-map center="38.54260065425841, -106.91915044613187" zoom="18" map-id="DEMO_MAP_ID">
    </gmp-map>
    <div class="position-absolute start-50 translate-middle-x bottom-0 mb-3 d-flex flex-nowrap align-items-center justify-content-center gap-2 px-3 py-2 rounded-3 bg-white shadow"
         style="max-width: calc(100% - 24px); background: rgba(255,255,255,0.94) !important;">
        <button type="button" id="recenterButton" hidden class="btn fw-bold text-white border-0 rounded-2"
                style="background:#1A73E8; box-shadow:0 2px 5px rgba(26,115,232,0.28);">Re-center
        </button>
        <button type="button" id="skipButton" class="btn fw-bold border rounded-2"
                style="border-color:#D2D7DF !important; color:#253044;">Skip Stop
        </button>
        <button type="button" id="endButton" class="btn fw-bold text-white border-0 rounded-2"
                style="background:#B3261E; box-shadow:0 2px 5px rgba(179,38,30,0.24);">End Tour
        </button>
    </div>
</div>
</body>

<script type="module" src="../static/tourNavigation.js"></script>
<!-- prettier-ignore -->

<input type="hidden" id="tour_id" name="tour_id" value="{{ tour_id }}">
{% endblock %}
