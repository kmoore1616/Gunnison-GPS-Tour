{% extends "visitornav.html" %}
{% block head %}
<title>View Tour</title>
<style>
    .on-tour-map gmp-map {
        height: clamp(300px, 60vh, 700px);
        width: 100%;
        max-width: none;
        margin: 0;
        padding-bottom: 0;
        display: block;
    }

    @media (max-width: 600px) {
        .on-tour-map gmp-map {
            height: 52vh;
        }
    }
</style>

<!-- prettier-ignore -->

            e.set("callback", c + ".maps." + q);

{% endblock %}
{% block content %}

<body id="view">
<div id="tour-id" hidden>{{ tour_id }}</div>
<h3 id="next-stop-name" class="on-tour-heading"></h3>
<!-- THIS NEEDS TO CENTER ON START! -->
<div class="on-tour-map">
    <gmp-map center="38.54260065425841, -106.91915044613187" zoom="18" map-id="DEMO_MAP_ID">
    </gmp-map>
    <div class="on-tour-controls">
        <button type="button" id="imHereButton" class="on-tour-button on-tour-button-primary">I'm Here</button>
        <button type="button" id="recenterButton" hidden class="on-tour-button on-tour-button-secondary">Center</button>
        <button type="button" id="skipButton" class="on-tour-button on-tour-button-light">Skip</button>
        <button type="button" id="endButton" class="on-tour-button on-tour-button-danger">End</button>
    </div>
</div>
</body>

<script type="module" src="../static/tourNavigation.js"></script>
<!-- prettier-ignore -->

<input type="hidden" id="tour_id" name="tour_id" value="{{ tour_id }}">
{% endblock %}
