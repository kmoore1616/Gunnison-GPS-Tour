{% extends "adminloginnav.html" %}

{% block title %} GCC Login {% endblock %}
{% block content %}
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <body>
<div id="login">
    <script src="/static/verification.js"></script>
    <div class="container">
        <div id="login-row" class="row justify-content-center align-items-center">
            <div id="login-column" class="col-md-6">
                <div id="login-box" class="col-md-12">
                    <form id="login-form" class="form" action="">
                        <img src="/static/chamber_logo_2026_v2.png" alt="Chamber Logo" class="img-fluid" style="max-width: 200px; display: block; margin: 0 auto;">
                        <div class="form-group">
                            <label for="username" class="text-info">Username:</label><br>
                            <input type="text" name="username" id="username" class="form-control"
                                   placeholder="Username">
                        </div>
                        <div class="form-group">
                            <label for="password" class="text-info">Password:</label><br>
                            <input type="password" name="password" id="password" class="form-control"
                                   placeholder="Password">
                        </div>
                        <div class="form-group">
                            <button type="button" onclick="login()" id="loginbutton" class="btn btn-info btn-md">
                                Sign in
                            </button>
                        </div>
                        <p id="error"></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


    </body>
{% endblock %}
