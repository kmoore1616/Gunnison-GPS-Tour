{% extends "visitornav.html" %}
{% block head %}
    <title>View Tour</title>
    <style>
    .tour-view {
        padding: 0 0 8rem;
    }

    .tour-meta {
        padding: 1rem;
    }

    .tour-actions {
        position: sticky;
        bottom: 4.5rem;
        z-index: 10;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        padding: 1rem;
        margin: 0;
    }

    .tour-actions button {
        min-width: 10rem;
        padding: 0.85rem 1.25rem;
        border: none;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    #skipButton {
        background: #f0b429;
        color: #1f1f1f;
    }

    #endButton {
        background: #b42318;
        color: #fff;
    }

    gmp-map {
        height: clamp(300px, 60vh, 700px);
        width: 100%;
        display: block;
    }

    @media (max-width: 600px) {
        .tour-view {
            padding-bottom: 9.5rem;
        }

        .tour-actions {
            bottom: 4rem;
            flex-direction: column;
        }

        .tour-actions button {
            width: 100%;
        }

        gmp-map {
            height: 50vh;
        }
    }
    </style>

    <script type="module" src="../static/map.js"></script>
    <!-- prettier-ignore -->
    <script>(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})
        ({key: "AIzaSyA5NCmT4YZvoa5KVQcOF1XHN3B8PxNpapQ", v: "weekly"});</script>

{% endblock %}
{% block content %}
<section id="view" class="tour-view">
  <div class="tour-meta">
  <h1>Name: {{ tour }}</h1>
  <h1>Estimated time: {{ time }}</h1>
  <h1>Average Rating: {{ rating }}</h1>
  <h1>ID: {{ tour_id }}</h1>

    <table>
    {% for i in col %}
    <tr>
      <td><a href="/places/{{i[0]}}">{{ i[1] }}</a></td> <!-- link to the location specific page-->
    </tr>
    {% endfor %}
  </table>
  </div>

    <div id="tour-id" hidden >{{ tour_id }}</div>
    <gmp-map center="38.54260065425841, -106.91915044613187" zoom="18" map-id="DEMO_MAP_ID">
    </gmp-map>
</section>

    <script type="module" src="../static/map.js"></script>
    <!-- prettier-ignore -->
    <script>(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})
        ({key: "AIzaSyA5NCmT4YZvoa5KVQcOF1XHN3B8PxNpapQ", v: "weekly"});</script>
    <script>
    </script>

    <div class="tour-actions">
        <button type="button" id="skipButton">Skip Stop</button>
        <button type="button" id="endButton">End Tour</button>
    </div>
    <input type="hidden" id="tour_id" name="tour_id" value="{{ tour_id }}">

{% endblock %}
