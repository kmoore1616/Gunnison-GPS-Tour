{% block content %}

<body id="view">
<div id="tour-id" hidden>{{ tour_id }}</div>
<h1>Name: {{ tour }}</h1>
<h1>Estimated time: {{ time }}</h1>
<h1>Average Rating: {{ rating }}</h1>

<h1>Stops on this Tour</h1>
<table>
    {% for i in col %}
    <tr>
        <td><a href="/places/{{i[0]}}">{{ i[1] }}</a></td> <!-- link to the location specific page-->
    </tr>
    {% endfor %}

<a href="http://127.0.0.1:5000/onTour/{{tour_id}}">Start the Tour</a>
<gmp-map center="38.54260065425841, -106.91915044613187" zoom="18" map-id="DEMO_MAP_ID"></gmp-map>
